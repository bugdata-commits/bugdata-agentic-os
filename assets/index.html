<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BUGDATA Agentic OS</title>
<style>
  :root { bg:#07070d; panel:#0f1117; border:#1f2937; accent:#f5b400; text:#e5e7eb; dim:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  .nav { display:flex; justify-content:space-between; align-items:center; padding:18px 24px; border-bottom:1px solid var(--border); background:var(--panel); }
  .brand { font-weight:800; letter-spacing:-0.02em; }
  .brand b { color:var(--accent); }
  .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:18px; margin-top:24px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .card h3 { margin:6px 0 8px; font-size:15px; }
  .card p { margin:0; color:var(--dim); font-size:13px; }
  .panel-title { font-size:20px; font-weight:700; margin-top:28px; }
  .bar { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:18px; }
  input, button { font:inherit; }
  .cmd { width:100%; padding:14px 16px; border-radius:10px; border:1px solid var(--border); background:#0b0d14; color:var(--text); outline:none; }
  .cmd:focus { border-color:var(--accent); }
  .send { margin-top:10px; padding:10px 16px; border:none; border-radius:10px; background:var(--accent); color:#000; font-weight:700; cursor:pointer; }
  .out { margin-top:12px; color:var(--dim); font-size:13px; min-height:18px; }
  .pill { display:inline-block; padding:4px 8px; border-radius:999px; background:#111827; border:1px solid var(--border); color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <nav class="nav">
    <div class="brand">BUGDATA <b>Agentic OS</b></div>
    <div style="color:var(--dim);font-size:13px;">MVP</div>
  </nav>
  <main class="wrap">
    <div class="panel-title">Command center</div>
    <p style="color:var(--dim);margin:8px 0 4px;">One place to run leads, marketplace, and agents.</p>
    <div class="grid">
      <div class="card">
        <h3>CRM</h3>
        <p>WhatsApp leads, contacts, and pipeline.</p>
        <span class="pill" id="crm-status">loading…</span>
      </div>
      <div class="card">
        <h3>Marketplace</h3>
        <p>Sphere listings from Supabase.</p>
        <span class="pill" id="market-status">loading…</span>
      </div>
      <div class="card">
        <h3>Agent</h3>
        <p>Run a business command.</p>
        <span class="pill">KYLA / Hermes</span>
      </div>
    </div>
    <div class="bar">
      <label style="font-size:13px;color:var(--dim);">Business command</label>
      <input class="cmd" id="command" placeholder='e.g. "route new lead to CRM", "create marketplace listing", "launch campaign"' />
      <button class="send" id="send">Run</button>
      <div class="out" id="out"></div>
    </div>
  </main>
  <script>
    const API = location.origin;
    async function loadStatus() {
      try {
        const r = await fetch(`${API}/api/crm/contacts`);
        document.getElementById('crm-status').textContent = r.ok ? 'CRM reachable' : 'CRM unreachable';
      } catch { document.getElementById('crm-status').textContent = 'CRM unreachable'; }
      try {
        const r = await fetch(`${API}/api/marketplace/listings`);
        document.getElementById('market-status').textContent = r.ok ? 'Live' : 'Unreachable';
      } catch { document.getElementById('market-status').textContent = 'Unreachable'; }
    }
    document.getElementById('send').onclick = async () => {
      const cmd = document.getElementById('command').value.trim();
      const out = document.getElementById('out');
      out.textContent = 'Running…';
      try {
        const r = await fetch(`${API}/api/agents/command`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({command: cmd}) });
        const data = await r.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) { out.textContent = 'Error: ' + e.message; }
    };
    loadStatus();
  </script>
</body>
</html>
